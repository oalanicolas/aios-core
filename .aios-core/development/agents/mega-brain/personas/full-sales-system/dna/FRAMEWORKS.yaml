  - id: "FW-FSS-002"
    nome: "Estrutura de Oferta (5 Steps)"
    descricao: "Sequencia de apresentacao de preco para maximizar conversao."

    componentes:
      - componente: "1. ANCORAGEM"
        descricao: "Comparativo integro ('Investimento normal R$30k')"
      - componente: "2. PRECO TABELA"
        descricao: "Base psicologica"
      - componente: "3. PROMOCIONAL"
        descricao: "~20% off (valida NA CALL)"
      - componente: "4. ULTIMA CONDICAO"
        descricao: "5-7% extra (se necessario)"
      - componente: "5. ARMAS"
        descricao: "Bonus ocultos, isencoes (ultimo recurso)"

    quando_usar: "Apresentando preco em call de vendas"

    como_aplicar: |
      1. Comecar com ancora alta (valor real ou mercado)
      2. Mostrar preco tabela
      3. Oferecer condicao promocional valida na call
      4. Se necessario, usar ultima condicao
      5. Armas so em casos de objecao financeira isolada

    evidencias:
      - citacao: "1. ANCORAGEM → 2. PRECO TABELA → 3. PROMOCIONAL → 4. ULTIMA CONDICAO → 5. ARMAS"
        chunk_id: "FSS001_019"
        source_id: "FSS001"
        source_title: "Playbook Interno Full Sales System"

    dominios:
      - "pricing"
      - "negotiation"
      - "closing"

    peso: 0.90

