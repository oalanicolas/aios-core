  - id: "FW-FSS-001"
    nome: "4 Tipos de SDR"
    descricao: "Framework para classificar e estruturar funcoes de pre-vendas."

    componentes:
      - componente: "SDR1 - FUNIS"
        descricao: "Trabalha leads de cadencia (1 mes), vindos de VSL, webinar, quiz"
        perfil: "Paciente, bom em follow-up, organizado"
      - componente: "SDR2 - SOCIAL SELLER"
        descricao: "Receptivo + Prospectivo no Instagram, 30-50 directs + 50-150 abordagens/dia"
        perfil: "Digital-native, criativo, rapido"
      - componente: "SDR3 - HUNTER"
        descricao: "Prospeccao ativa externa, cold call, cold email, lista externa"
        perfil: "Agressivo, resiliente, nao leva rejeicao pessoal"
      - componente: "SDR4 - FARMER"
        descricao: "Repescagem coordenada, leads que nao fecharam ha 30-60-90 dias"
        perfil: "Persistente, paciente, bom em reativacao"

    quando_usar: "Contratando SDRs ou estruturando area de pre-vendas"

    como_aplicar: |
      1. Identificar fonte de leads primaria
      2. Mapear para tipo de SDR correspondente
      3. Contratar com perfil especifico
      4. Nao trocar SDR de funcao

    evidencias:
