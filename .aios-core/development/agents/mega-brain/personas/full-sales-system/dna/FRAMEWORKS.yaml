  - id: "FW-FSS-004"
    nome: "Pipeline CRM (3 Pipelines)"
    descricao: "Estrutura de pipelines para Go High Level ou similar."

    componentes:
      - componente: "Pipeline Pre-vendas"
        etapas: "Entrada → FU1 → FU2 → FU3 → Agendamento → Reagendamento → Sales Farming"
      - componente: "Pipeline Vendas"
        etapas: "Agendado → No Show → Venda c/ Sinal → Venda Concluida → Farming"
      - componente: "Pipeline CS"
        etapas: "Onboarding → Acompanhamento → Renovacao → Fidelizacao"

    quando_usar: "Configurando CRM para operacao comercial"

    como_aplicar: |
      1. Criar os 3 pipelines separados
      2. Configurar automacoes entre etapas
      3. Definir SLAs por etapa
      4. Integrar com comunicacao

