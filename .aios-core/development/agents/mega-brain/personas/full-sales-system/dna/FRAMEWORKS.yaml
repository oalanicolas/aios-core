    descricao: "Framework de compensacao calibrado para mercado brasileiro."

    componentes:
      - componente: "SDR"
        fixo: "R$2.000"
        variavel: "R$10-15/agendamento que aparece"
      - componente: "Closer"
        fixo: "R$3.000"
        variavel: "3-5% comissao"
      - componente: "Gestor"
        fixo: "R$5.000-6.500"
        variavel: "0.5-0.7% sobre vendas do time"

    quando_usar: "Definindo pacote de remuneracao para time comercial"

    como_aplicar: |
      1. Usar como base para negociacao
      2. Ajustar conforme regiao (SP paga mais)
      3. Variavel deve ser atingivel (OTE realista)
      4. Revisar a cada 6 meses

