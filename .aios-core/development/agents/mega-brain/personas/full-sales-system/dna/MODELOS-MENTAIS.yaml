    descricao: "Modelo de tres niveis de produto para estruturar oferta e entrega."

    quando_aplicar: "Definindo mix de produtos e precificacao"

    como_usar: |
      FRONT END (DIY - Do It Yourself):
      → R$500-3k
      → Entrada ou saida
      → Cursos, templates, ferramentas

      BACK END (DWY - Done With You):
      → R$10-30k
      → Principal oferta
      → Mentoria, grupo, acompanhamento
      → ESCALAVEL

      HIGH END (DFY - Done For You):
      → R$50k+
      → Caixa
      → Servico executado
      → POUCA ESCALA

