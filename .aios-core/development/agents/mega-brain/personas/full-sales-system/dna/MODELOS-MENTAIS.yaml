    nome: "Calibracao Brasil vs USA"
    descricao: "Modelo para ajustar expectativas e metricas do mercado americano para Brasil."

    quando_aplicar: "Implementando frameworks americanos no Brasil"

    como_usar: |
      REMUNERACAO:
      Brasil = 10-15% do mercado americano

      SDR fixo: R$2k (~$400) vs USA $3.3k/mes
      Closer OTE: R$6-10k vs USA $10-18k

      TERMINOLOGIA:
