  - id: "MM-FSS-001"
    nome: "4 Tipos de SDR"
    descricao: "Modelo para classificar e contratar SDRs baseado na funcao especifica que executarao."

    quando_aplicar: "Contratando SDRs ou estruturando area comercial"

    como_usar: |
      IDENTIFICAR qual tipo de lead voce tem:

      SDR1 - FUNIS:
      → Leads de cadencia (1 mes)
      → Vieram de VSL, webinar, quiz
      → Trabalho de nurture e follow-up

      SDR2 - SOCIAL SELLER:
      → Receptivo + Prospectivo no Instagram
      → 30-50 directs + 50-150 abordagens/dia
      → Requer perfil digital-native

      SDR3 - HUNTER:
      → Prospeccao ativa externa
      → Cold call, cold email, lista externa
      → Perfil agressivo e resiliente

      SDR4 - FARMER (SALES FARMING):
      → Repescagem coordenada
      → Leads que nao fecharam ha 30-60-90 dias
      → Perfil paciente e persistente

    evidencias:
