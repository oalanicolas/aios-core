  - id: "MM-FSS-003"
    nome: "Dimensionamento Comercial"
    descricao: "Modelo para calcular tamanho de time baseado em volume de leads e capacidade."

    quando_aplicar: "Decidindo quando contratar mais pessoas"

    como_usar: |
      SDR: 15-25 leads/dia = 1 SDR (max 750/mes)
      → Menos que 15: SDR ocioso
      → Mais que 25: Qualidade cai

      CLOSER:
      → 3-4 calls/dia = IDEAL
      → 5 calls/dia = LIMITE
      → 6+ calls/dia = CONTRATAR IMEDIATO

      RATIO INICIAL: 1 SDR : 1 Closer
      → Ajustar conforme taxa de conversao

    evidencias:
