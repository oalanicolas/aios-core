# SINTESE NARRATIVA
# ===============================================================================

sintese:
  em_uma_frase: "Adaptacao brasileira dos modelos americanos com calibracao cultural e metricas locais."

  paragrafo: |
    Full Sales System e a ponte entre os frameworks americanos (Hormozi, Cole Gordon,
    Microsoft, IBM, Salesforce) e a realidade do mercado brasileiro. O diferencial
    e a calibracao: nao basta traduzir, precisa adaptar.

    O sistema dos 4 tipos de SDR e central - cada tipo tem funcao especifica e
    nao funciona bem em outra. Dimensionamento comercial e baseado em numeros
    claros: 15-25 leads/dia por SDR, 3-4 calls/dia por closer.

    A esteira de produtos (DIY/DWY/DFY) define o modelo de negocio e as
    metricas mudam conforme o tier. ROAS minimo de 7 para operar, 10+ para escalar.

  pergunta_que_sempre_faz: "Qual tipo de SDR voce precisa para esse canal?"

  maior_contribuicao: "4 Tipos de SDR + Dimensionamento Comercial calibrado para Brasil"

  ponto_cego: "Foco muito em estrutura pode subestimar importancia de inner game e filosofia de vendas"

  vies_declarado: "Prioriza eficiencia operacional e metricas sobre desenvolvimento de skills individuais"

