# Sintese narrativa
sintese_narrativa: |
  G4 Educacao representa a calibracao Brasil dos frameworks de vendas americanos.
  Nao e copia - e adaptacao cultural e terminologica para o mercado local.

  Enquanto americano fala em SDS e BC, brasileiro usa SDR e Closer. Terminologia
  importa para comunicacao no time.

  CX (Customer Experience) e tao importante quanto o produto - 89% dos brasileiros
  concordam. Employee Experience vem primeiro: funcionario feliz, cliente bem atendido.

  Foco nos detratores, nao nos promotores. Detrator recuperado vira promotor mais leal.

